name: Verify

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pnpm verify (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [static, packages, starters]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify --part ${{ matrix.part }}
